name: Build APK

on:
  push:
    branches: [main, master, arena/**]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles("**/*.gradle*", "**/gradle-wrapper.properties") }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine build variant
        id: variant
        run: |
          BT="${{ github.event.inputs.build_type }}"
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then BT="release"; fi
          if [ -z "$BT" ]; then BT="debug"; fi
          echo "type=$BT" >> "$GITHUB_OUTPUT"
          FIRST=$(echo "$BT" | head -c1 | tr "[:lower:]" "[:upper:]")
          REST=$(echo "$BT" | tail -c+2)
          echo "task=assemble${FIRST}${REST}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore (release)
        if: steps.variant.outputs.type == "release"
        id: keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$HOME/keystore.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        if: steps.variant.outputs.type == "debug"
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (signed)
        if: steps.variant.outputs.type == "release" && steps.keystore.outputs.present == "true"
        env:
          PYMOBILE_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          PYMOBILE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          PYMOBILE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export PYMOBILE_KEYSTORE="$HOME/keystore.jks"
          ./gradlew assembleRelease --stacktrace

      - name: Build Release APK (unsigned fallback)
        if: steps.variant.outputs.type == "release" && steps.keystore.outputs.present != "true"
        run: |
          echo "::warning::No signing secrets — building unsigned release APK."
          ./gradlew assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -e
          VARIANT="${{ steps.variant.outputs.type }}"
          APK_PATH=$(find "app/build/outputs/apk/$VARIANT" -name "*.apk" ! -name "*-unaligned.apk" | head -1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMobileIDE-${{ steps.variant.outputs.type }}-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release (tag builds)
        if: startsWith(github.ref, "refs/tags/v")
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
